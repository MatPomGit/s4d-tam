site_name: S4D-TAM Benchmark
site_description: Reproducible benchmark and reference implementation for Semantic 4D Token Attention Map autonomous UAV navigation.
site_url: https://matpomgit.github.io/s4d-tam/
repo_url: https://github.com/MatPomGit/s4d-tam
repo_name: MatPomGit/s4d-tam
edit_uri: edit/main/docs/

copyright: Copyright &copy; S4D-TAM contributors

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.keys

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Benchmark:
      - Project status: project-status.md
      - Architecture: architecture.md
      - Module catalog: modules.md
      - Two-level comparison protocol: comparison-protocol.md
      - Dataset and baseline readiness: readiness.md
      - Methodology: methodology.md
      - Metrics: metrics.md
      - Datasets: datasets.md
      - Artifact specification: artifact-specification.md
  - Evaluation protocols:
      - Reproducibility: reproducibility.md
      - Preregistration: preregistration.md
      - SIL protocol: sil-protocol.md
      - HIL protocol: hil-protocol.md
      - Real-flight protocol: real-flight-protocol.md
      - Token event logging: token-event-logging.md
  - Reproduction and compliance:
      - Independent reproduction package: independent-reproduction-package.md
      - Compliance report: compliance-report.md
  - Development:
      - Roadmap: roadmap.md
      - Contributing: contributing.md
      - Changelog: changelog.md
      - Citation: citation.md
