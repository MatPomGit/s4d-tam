name: Finalize paper artifacts

on:
  push:
    branches: [research/two-level-validation-paper]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/two-level-validation-paper

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install document tooling
        run: |
          python -m pip install python-docx
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer

      - name: Build final manuscript
        run: |
          python tools/update_paper_0830_v2.py
          mv paper/S4D_TAM_draft_0830_updated.docx paper/S4D_TAM_draft_0830.docx

      - name: Export readable PDF
        run: |
          mkdir -p /tmp/paper-pdf
          libreoffice --headless --convert-to pdf --outdir /tmp/paper-pdf paper/S4D_TAM_draft_0830.docx
          mv /tmp/paper-pdf/S4D_TAM_draft_0830.pdf paper/S4D_TAM_draft_0830.pdf
          test -s paper/S4D_TAM_draft_0830.docx
          test -s paper/S4D_TAM_draft_0830.pdf

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/S4D_TAM_draft_0830.docx paper/S4D_TAM_draft_0830.pdf
          if git diff --cached --quiet; then
            echo "Paper artifacts are already current."
          else
            git commit -m "docs: publish updated S4D-TAM manuscript"
            git push origin HEAD:research/two-level-validation-paper
          fi

      - name: Upload verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: final-paper-0830
          path: |
            paper/S4D_TAM_draft_0830.docx
            paper/S4D_TAM_draft_0830.pdf
          retention-days: 1
