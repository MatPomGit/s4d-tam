name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "configs/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "configs/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m pytest --cov=s4dtam_benchmark --cov-report=term-missing

  quality:
    name: Code quality / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Keep the interpreter aligned with tool.mypy.python_version. The
          # tests job above remains responsible for Python 3.10 compatibility.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development tools
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests tools

      - name: Mypy
        run: python -m mypy src

  smoke:
    name: Smoke benchmark
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Run smoke benchmark
        run: s4dtam-bench run configs/experiments/smoke.yaml

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: outputs/smoke/
          if-no-files-found: warn
          retention-days: 7

  release-integrity:
    name: Release integrity
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Validate release metadata
        run: s4dtam-release-check

      - name: Build release bundle
        run: python tools/build_release.py
