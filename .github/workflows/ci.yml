name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest --cov=s4dtam_benchmark --cov-report=term-missing
      - run: s4dtam-release-check
      - run: s4dtam-bench run configs/experiments/smoke.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-results-py${{ matrix.python-version }}
          path: outputs/smoke/

  release-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: s4dtam-release-check
      - run: python tools/build_release.py
