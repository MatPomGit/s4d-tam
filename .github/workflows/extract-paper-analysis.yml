name: Extract paper for review

on:
  push:
    branches: [analysis/paper-draft-0830]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Extract DOCX text
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET

          source = Path('paper/S4D_TAM_draft_0830.docx')
          output = Path('paper-review.txt')
          W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'

          with ZipFile(source) as zf:
              root = ET.fromstring(zf.read('word/document.xml'))

          blocks = []
          for element in root.iter():
              if element.tag == f'{{{W}}}p':
                  text = ''.join(t.text or '' for t in element.iter(f'{{{W}}}t')).strip()
                  if text:
                      blocks.append(text)
          output.write_text('\n\n'.join(blocks), encoding='utf-8')
          print(f'Extracted {len(blocks)} paragraphs to {output}')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: paper-review-text
          path: paper-review.txt
          retention-days: 1
