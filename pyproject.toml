[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s4dtam-benchmark"
version = "0.1.0"
description = "Reproducible benchmark and reference implementation for S4D-TAM UAV navigation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "S4D-TAM contributors"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.1",
  "types-PyYAML>=6.0",
]

[project.scripts]
s4dtam-bench = "s4dtam_benchmark.cli:main"
s4dtam-release-check = "s4dtam_benchmark.release:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.12"
files = ["src"]
packages = ["s4dtam_benchmark"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
# scipy does not expose complete inline typing across every supported Python
# version.  Keep this exception narrow rather than silencing typed dependencies.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
