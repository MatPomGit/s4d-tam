schema: s4dtam-tartanair-orb-pipeline/v1

# All relative paths are resolved from the repository root.
work_root: artifacts/runs/tartanair-orb-slam3-development
experiment_config: configs/experiments/tartanair_orb_slam3_development.yaml

tartanair:
  # Replace with the exact local path to the selected upstream cohort.
  raw_root: data/upstream/tartanair
  # Must be verified against the exact upstream release/protocol. Do not guess.
  fps: 10.0
  link_mode: symlink
  converted_root: data/raw/tartanair-converted
  freeze_root: artifacts/manifests/tartanair/frozen
  overwrite_conversion: false

orb_slam3:
  config: configs/algorithms/orb_slam3.yaml
  input_root: artifacts/baseline-inputs/orb_slam3/tartanair
  result_root: outputs/baselines/orb_slam3
  vocabulary: artifacts/baselines/orb_slam3/ORBvoc.txt
  overwrite_inputs: false
  resume_results: true

  # The command is intentionally site-specific because the pinned ORB-SLAM3 image/wrapper
  # must actually exist in the execution environment. The command is executed once per
  # frozen sequence and MUST create {result_path} in the normalized NPZ contract.
  # Available placeholders:
  #   {sequence_id} {input_dir} {settings} {vocabulary} {result_path}
  # Example wrapper shape (replace with the verified local/container command):
  # command_template: >-
  #   tools/orb_slam3_wrapper.sh
  #   --vocabulary {vocabulary}
  #   --settings {settings}
  #   --sequence {input_dir}
  #   --output {result_path}
  command_template: ""
