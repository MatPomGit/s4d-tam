schema_version: 1
required:
  source_tag: signed Git tag
  source_commit: 40-character Git object ID
  source_archive_sha256: lowercase SHA-256
  created_at_utc: ISO-8601 UTC timestamp
  issuer: accountable release identity
  target_platform: OS, architecture, libc and accelerator ABI
  container_digest: OCI digest, or explicit null with justification
  wheelhouse_manifest_sha256: SHA-256 of the dependency inventory
  numerical_tolerances: per-output absolute and relative tolerances
