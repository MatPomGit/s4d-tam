name: s4d_tam_reference
type: s4dtam_reference
association_radius_m: 0.35
association_mode: feature
association_rejection_threshold: 0.35
status: numerical_reference_not_trained_model
forecasting:
  # Dataset horizons are always included; these add requested physical-time horizons.
  horizons_s: []
lifecycle:
  activation_hits: 1
  sleep_after_s: 10.0
  reactivate_on_match: true
  merge_distance_m: 0.0
  remove_after_s: 60.0
budgets:
  max_tokens: 10000
  max_memory_bytes: 268435456
  max_update_time_ms: 50.0
  max_history_entries: 64
event_logging:
  enabled: true
  directory: logs
  flush_each_event: false
  include_attention_components: true
encoders:
  output_dim: 3
  rgb: {scale: 0.00392156862745098}
  thermal: {scale: 0.01}
  lidar: {scale: 1.0}
  imu: {scale: 1.0}
  gnss: {scale: 1.0}
fusion:
  strategy: confidence_weighted_mean
  weights:
    rgb: 1.0
    thermal: 1.0
    lidar: 1.0
    imu: 1.0
    gnss: 1.0
noise_model:
  # Position variances are expressed in square metres in the common 3-D state space.
  modality_variances:
    rgb: 0.08
    thermal: 0.10
    lidar: 0.02
    imu: 0.12
    gnss: 0.04
    fused: 0.03
    legacy: 0.05
  default_variance: 0.05
  process_variance_per_s: 0.01
  quality_power: 2.0
  minimum_quality: 0.05
modality_degradation:
  stream_absent: exclude_for_entire_sequence
  sample_missing: exclude_sample_and_reuse_last_fused_observation
  quality_rejected: exclude_sample_and_reuse_last_fused_observation
  no_usable_modalities: reuse_last_fused_observation_or_zero_at_sequence_start
