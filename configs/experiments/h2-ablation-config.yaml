# Evaluators and Metrics definitions as per preregistered protocol (§7.3)
evaluators:
  primary_endpoints:
    forecasting:
      - name: "occupancy_iou_1s"
        threshold: 0.5
        metric_class: "OccupancyIoUMetric"
        horizon_s: 1.0
        
  secondary_endpoints:
    forecasting:
      - name: "flow_epe"
        metric_class: "FlowEPEMetric"
      - name: "temporal_flip_rate"
        metric_class: "TemporalLabelFlipMetric"
    semantics:
      - name: "miou"
        metric_class: "MeanIoUMetric"
    localization:
      - name: "ate_rmse"
        metric_class: "AbsoluteTrajectoryErrorRMSE"
        align_se3: true
        scale_correction: false

# Statistical Inference Settings (§7.4)
statistical_inference:
  mode: "paired_sequence_level"
  alpha_family_wise: 0.05
  multiplicity_correction: "Holm"        # Core step of the sequential Holm procedure for family H1-H7
  bootstrap:
    enabled: true
    resamples: 10000                     # 10,000 resamples for BCa confidence intervals
    confidence_level: 0.95
    method: "BCa"
