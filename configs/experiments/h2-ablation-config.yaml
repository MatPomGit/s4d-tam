# S4D-TAM Benchmark Configuration File
# Experiment: H2 Ablation Study (H2_no_temporal_state)
# Preregistered Hypothesis: Temporal state improves 1s future-state prediction.
# -----------------------------------------------------------------------------

metadata:
  experiment_id: "s4dtam_ablation_h2"
  hypothesis: "H2"
  variant_id: "H2_no_temporal_state"
  description: "Ablation of S4D-TAM temporal state to test its effect on 1s future-state occupancy forecasting."
  cohort_id: "frozen-2026-01"
  author: "Generated by Gemini Notebook (Grounding: dr inż. Mateusz Pomianek)"

reproducibility:
  global_seed: 42
  num_replications: 1
  verify_dataset_hashes: true

# Definition of the model variant (Disabling temporal mechanisms)
model_variant:
  name: "S4D-TAM (Ablated: No Temporal State)"
  type: "internal_ablation"
  
  # Temporal state definition components ablated (§4.1, §5.11)
  token_attributes:
    enable_velocity_vector: false       # Ablated v_i (estimated velocity/motion vector)
    enable_observation_history: false   # Ablated h_i (timestamps, sensor sources, observation counts)
    enable_motion_state: false          # Ablated delta_k (static, dynamic, periodic classification)
    enable_occlusion_prediction: false  # Ablated Omega_k tracking based on temporal trajectory
    
  # Spatiotemporal attention mechanism (§5.4)
  spatiotemporal_attention:
    attention_radius_local_m: 5.0
    enable_temporal_encoding: false     # Ablated phi(p_i, p_k, t_i, t_k) time-decay scaling
    enable_uncertainty_gate: true       # Preserved psi(u_i, u_k)
    
  # Occupancy and risk forecasting layers (§5.7, §5.12)
  forecasting_layer:
    enabled: false                      # Ablated f_pred causal forecasting
    default_occupancy_fallback: 0.5     # Fallback value for unobserved regions without temporal context
    
  # Trajectory planning parameters (§5.8, §5.13)
  trajectory_planner:
    type: "deterministic_beam_search"   # Target MPPI is bypassed for deterministic evaluation consistency
    time_horizon_s: 1.0
    weights:
      path_length: 1.0
      energy_cost: 0.5
      collision_probability: 2.0
      environmental_risk: 1.5           # Risk forecasting disabled under this ablation, falls back to static maps
      map_uncertainty: 1.0

# Registered offline study dataset adapters and sequence mapping (§7.1)
